<div class="logs-container">
  <mat-tab-group
    #componentTabGroup
    (selectedTabChange)="componentTabChange(componentTabGroup.selectedIndex)"
    class="component-tabs"
    animationDuration="0ms"
  >
    <mat-tab
      *ngFor="let component of components"
      label="{{ component | titlecase }}"
    >
      <ng-template matTabContent>
        <mat-tab-group
          #containerTabGroup
          (selectedTabChange)="
            containerTabChange(containerTabGroup.selectedIndex)
          "
          class="container-tabs"
          animationDuration="0ms"
        >
          <mat-tab
            *ngFor="let container of isvcComponents[component].containers"
            label="{{ container }}"
          >
            <ng-template matTabContent>
              <div class="log-viewer-wrapper">
                <div class="logs-toolbar">
                  <div class="logs-filters">
                    <mat-form-field appearance="outline" class="search-field">
                      <mat-label>Search Logs</mat-label>
                      <input
                        matInput
                        [(ngModel)]="searchText"
                        placeholder="Search logs"
                      />
                    </mat-form-field>

                    <mat-form-field
                      appearance="outline"
                      class="line-count-field"
                    >
                      <mat-label>Lines</mat-label>
                      <mat-select
                        [(ngModel)]="lineCount"
                        (selectionChange)="refreshLogs()"
                      >
                        <mat-option
                          *ngFor="let count of lineCountOptions"
                          [value]="count"
                        >
                          {{ count === 'all' ? 'All' : count }}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="severity-field">
                      <mat-label>Severity</mat-label>
                      <mat-select [(ngModel)]="severity">
                        <mat-option value="all">All</mat-option>
                        <mat-option value="error">Error</mat-option>
                        <mat-option value="warn">Warning</mat-option>
                        <mat-option value="info">Info</mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>

                  <div class="logs-toggles">
                    <mat-slide-toggle
                      color="primary"
                      [(ngModel)]="showPreviousLogs"
                      (change)="refreshLogs()"
                      matTooltip="Show logs from the previous container instance"
                    >
                      Previous
                    </mat-slide-toggle>

                    <mat-slide-toggle
                      color="primary"
                      [(ngModel)]="showTimestamps"
                      (change)="refreshLogs()"
                      matTooltip="Include timestamps in log entries"
                    >
                      Timestamps
                    </mat-slide-toggle>

                    <mat-slide-toggle
                      color="primary"
                      [(ngModel)]="followLogs"
                      matTooltip="Follow new log entries automatically"
                    >
                      Follow logs
                    </mat-slide-toggle>
                  </div>

                  <div class="logs-actions">
                    <button
                      mat-icon-button
                      color="primary"
                      matTooltip="Refresh"
                      (click)="refreshLogs()"
                    >
                      <mat-icon>refresh</mat-icon>
                    </button>

                    <button
                      mat-icon-button
                      color="primary"
                      matTooltip="Download Logs"
                      (click)="downloadLogs()"
                    >
                      <mat-icon>file_download</mat-icon>
                    </button>

                    <button
                      mat-icon-button
                      color="primary"
                      matTooltip="Copy Logs"
                      (click)="copyLogs()"
                    >
                      <mat-icon>content_copy</mat-icon>
                    </button>
                  </div>
                </div>

                <lib-loading-spinner
                  *ngIf="!logsRequestCompleted"
                  class="spinner-overlay"
                >
                </lib-loading-spinner>

                <div *ngIf="loadErrorMsg.length" class="error-msg">
                  <lib-icon icon="warning" class="warn-icon"></lib-icon>
                  <span>{{ loadErrorMsg }}</span>
                </div>

                <app-logs-viewer
                  *ngIf="filteredLogs.length"
                  [logs]="filteredLogs"
                  [followLogs]="followLogs"
                  [searchText]="searchText"
                >
                </app-logs-viewer>

                <div
                  *ngIf="
                    logsRequestCompleted &&
                    !filteredLogs.length &&
                    !loadErrorMsg.length
                  "
                  class="no-logs"
                >
                  No logs available for this container.
                </div>
              </div>
            </ng-template>
          </mat-tab>
        </mat-tab-group>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
