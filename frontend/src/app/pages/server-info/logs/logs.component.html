<div class="logs-container">
  <div class="logs-header">
    <div class="logs-title">Logs</div>
    <button
      type="button"
      class="follow-logs-button"
      [attr.aria-pressed]="followLogs"
      (click)="toggleFollowLogs()"
    >
      {{ followLogs ? 'Following logs' : 'Follow logs' }}
    </button>
  </div>

  <ng-container *ngIf="components.length === 1; else componentTabs">
    <ng-container
      *ngTemplateOutlet="componentLogs; context: { component: components[0] }"
    ></ng-container>
  </ng-container>

  <ng-template #componentTabs>
    <mat-tab-group
      #componentTabGroup
      (selectedTabChange)="componentTabChange(componentTabGroup.selectedIndex)"
      class="component-tabs"
      animationDuration="0ms"
    >
      <mat-tab
        *ngFor="let component of components"
        label="{{ component | titlecase }}"
      >
        <ng-template matTabContent>
          <ng-container
            *ngTemplateOutlet="componentLogs; context: { component: component }"
          ></ng-container>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </ng-template>

  <ng-template #componentLogs let-component="component">
    <div class="container-selector">
      <div class="container-label">Containers</div>
      <mat-tab-group
        #containerTabGroup
        (selectedTabChange)="
          containerTabChange(containerTabGroup.selectedIndex)
        "
        class="container-tabs"
        animationDuration="0ms"
      >
        <mat-tab
          *ngFor="let container of isvcComponents[component].containers"
          label="{{ container }}"
        >
          <ng-template matTabContent>
            <div class="log-viewer-wrapper">
              <lib-loading-spinner
                *ngIf="!logsRequestCompleted"
                class="spinner-overlay"
              ></lib-loading-spinner>

              <div *ngIf="loadErrorMsg.length" class="error-msg">
                <lib-icon [icon]="'warning'" class="warn-icon"></lib-icon>
                <span>{{ loadErrorMsg }}</span>
              </div>

              <app-logs-viewer
                *ngIf="currLogs.length"
                [logs]="currLogs"
                [followLogs]="followLogs"
              ></app-logs-viewer>

              <div
                *ngIf="
                  logsRequestCompleted &&
                  !currLogs.length &&
                  !loadErrorMsg.length
                "
                class="no-logs"
              >
                No logs available for this container.
              </div>
            </div>
          </ng-template>
        </mat-tab>
      </mat-tab-group>
    </div>
  </ng-template>
</div>
