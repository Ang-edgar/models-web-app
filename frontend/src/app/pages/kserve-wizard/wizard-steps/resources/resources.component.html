<h2>Resources</h2>

<p class="intro">
  Configure compute resources for the endpoint.
</p>

<div class="field-row">

  <div class="field">
    <label>CPU Request</label>

    <input
      type="number"
      min="0"
      step="0.1"
      [(ngModel)]="wizard.cpuRequest"
      placeholder="1" />
  </div>

  <div class="field">
    <label>CPU Limit</label>

    <input
      type="number"
      min="0"
      step="0.1"
      [(ngModel)]="wizard.cpuLimit"
      placeholder="2" />
  </div>

</div>

<div class="field-row">

  <div class="field">
    <label>Memory Request</label>

      <div class="input-with-unit">
        <input
          type="number"
          min="0"
          [(ngModel)]="wizard.memoryRequest"
        />

        <select [(ngModel)]="wizard.memoryRequestUnit">
          <option value="Mi">MB</option>
          <option value="Gi">GB</option>
        </select>
      </div>

  </div>

  <div class="field">
    <label>Memory Limit</label>

    <div class="input-with-unit">
      <input
        type="number"
        min="0"
        [(ngModel)]="wizard.memoryLimit"
      />

      <select [(ngModel)]="wizard.memoryLimitUnit">
        <option value="Mi">MB</option>
        <option value="Gi">GB</option>
      </select>
    </div>


  </div>

</div>
<div class="gpu-section">

  <label class="checkbox">

    <input
      type="checkbox"
      [(ngModel)]="wizard.gpuEnabled" />

    Enable GPU

  </label>

</div>

<div *ngIf="wizard.gpuEnabled">

    <div class="field-row">

      <div class="field">
        <label>GPU Vendor</label>

        <input
          [(ngModel)]="wizard.gpuVendor"
          readonly
        />
      </div>

      <div class="field">
        <label
          title="Examples: L40S, H100, A100, RTXA4000">
          GPU Model
        </label>

        <input
          [(ngModel)]="wizard.gpuModel"
          placeholder="L40S"
        />

        <div class="gpu-hint">
          Examples: L40s, H100, A100, A4000 (Please refer to the available GPU in the Grafana Dashboard)
        </div>

      </div>

    </div>

    <div class="field-row">

      <div class="field">
        <label>GPU Count</label>

        <input
          type="number"
          min="1"
          [(ngModel)]="wizard.gpuCount"
        />
      </div>

      <div class="field">
        <label>GPU Core (%)</label>

        <input
          type="number"
          min="1"
          max="100"
          [(ngModel)]="wizard.gpuCore"
        />
      </div>

      <div class="field">
        <label>GPU Memory (MB)</label>

        <input
          type="number"
          min="1"
          [(ngModel)]="wizard.gpuMemory"
        />
      </div>

    </div>

    <div class="info-box">
      Leave GPU Core and GPU Memory empty to allocate whole GPUs.
    </div>

</div>
