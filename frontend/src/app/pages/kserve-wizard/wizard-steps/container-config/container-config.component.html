<h2>Container Configuration</h2>

<p class="intro">
  Configure container ports, startup commands and runtime arguments.
</p>

<!-- Custom Runtime -->
<div *ngIf="wizard.runtime === 'custom'">

  <div class="field">

    <label>Ports</label>

    <div
      class="port-row"
      *ngFor="let port of wizard.ports; let i = index">

      <input
        [(ngModel)]="port.name"
        placeholder="http1" />

      <input
        type="number"
        [(ngModel)]="port.containerPort"
        placeholder="8080" />

      <button
        type="button"
        class="remove-btn"
        (click)="removePort(i)"
        *ngIf="wizard.ports.length > 1">

        Remove

      </button>

    </div>

    <button
      type="button"
      class="add-btn"
      (click)="addPort()">

      Add Port

    </button>

  </div>

  <div class="field">

    <label>Startup Script (Optional)</label>

    <div
      #editor
      class="command-editor">
    </div>

  </div>

</div>

<!-- Built-in Runtime -->
<div *ngIf="wizard.runtime !== 'custom'">

  <h3>Runtime Arguments</h3>

  <p class="help-text">
    Override or add runtime arguments to the selected serving runtime.
  </p>

  <div class="runtime-arg-chips">

    <button
      type="button"
      class="chip"
      *ngFor="let arg of availableChips"
      (click)="addRuntimeArgChip(arg)">

      + {{ arg.label }}

    </button>

  </div>

  <div class="custom-arg-row">

    <input
      [(ngModel)]="customRuntimeArg"
      placeholder="--my-custom-arg">

    <button
      type="button"
      (click)="addCustomRuntimeArg()">

      Add Custom Argument

    </button>

  </div>

  <table class="args-table">

    <thead>
      <tr>
        <th>Argument</th>
        <th>Value</th>
        <th></th>
      </tr>
    </thead>

    <tbody>

      <tr
        *ngFor="
          let arg of wizard.runtimeArgs;
          let i = index">

        <td class="argument-cell">

          {{ arg.argument }}

        </td>

        <td>

          <input
            [(ngModel)]="arg.value"
            placeholder="65536">

        </td>

        <td>

          <button
            type="button"
            (click)="removeRuntimeArg(i)">

            ✕

          </button>

        </td>

      </tr>

    </tbody>

  </table>


</div>
